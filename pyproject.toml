[project]
name = "probably-4"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ivan_p", email = "ivanponono@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=13.0.0",
]

[project.scripts]
probably-4 = "probably_4:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
