[project]
name = "probably-4"
version = "1.0.1"
description = "A deliberately frustrating calculator with impeccable manners."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "ivan_p" }
]
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=13.0.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
